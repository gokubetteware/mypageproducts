<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pago cancelado · Saphiless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --crema:#F7F0E8; --lila:#CFC0F6; --morado:#511BDB; --noche:#140A33; --negro:#0A0A0A; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--noche); color: var(--crema); font-family: 'Instrument Sans', system-ui, sans-serif; }
  .card { width: 100%; max-width: 480px; padding: 40px 32px; border-radius: 36px; background: var(--crema); color: var(--negro); }
  .logo { height: 36px; display: block; margin-bottom: 32px; }
  h1 { margin: 0 0 12px; font-size: clamp(34px, 8vw, 46px); line-height: .98; letter-spacing: -.045em; font-weight: 700; }
  h1 em { font-style: normal; color: var(--morado); }
  p { margin: 0 0 28px; font-size: 18px; line-height: 1.4; color: #3a3350; }
  a.b { display: inline-block; padding: 15px 28px; border-radius: 999px; background: var(--morado); color: var(--crema); font-weight: 700; font-size: 17px; text-decoration: none; transition: background .15s; }
  a.b:hover { background: var(--negro); }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="assets/logo-saphiless.svg" alt="Saphiless">
  <h1>Sin <em>cargo.</em></h1>
  <p>El pago se canceló y no se cobró nada. Si quieres intentarlo otra vez, pídeme un enlace nuevo por WhatsApp.</p>
  <a class="b" href="/">Volver a Saphiless</a>
</main>
</body>
</html>
