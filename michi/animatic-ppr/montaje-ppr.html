:root{
  --papel:#F3EFE6; --papel-hondo:#E3DDD0; --tinta:#05070A; --ambar:#E8C46A;
  --gris-calido:#5E5A52; --gris-apoyo:#8C8577;
  --arcilla-muro:#EDD2BC; --arcilla-piso:#E1BEA3; --agua-muro:#B7D3CF; --agua-piso:#9FC2BD; --petroleo:#1E5652;
  --piso:1300px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#2a2925;color:#E3DDD0;font-family:Archivo,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:hidden}
body.capture{background:#000;padding:0;display:block}

/* ---------- Escenario 1080 × 1920 ---------- */
#viewport{position:relative;width:min(calc((100vh - 140px) * 9 / 16), calc(100vw - 32px));aspect-ratio:9/16}
body.capture #viewport{width:1080px;height:1920px}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;font-feature-settings:"tnum" 1,"lnum" 1}
.wall{position:absolute;left:0;top:0;width:100%;height:var(--piso)}
.floor{position:absolute;left:0;top:var(--piso);width:100%;bottom:0}
[data-bg=arcilla]>.wall{background:var(--arcilla-muro)}
[data-bg=arcilla]>.floor{background:var(--arcilla-piso)}
[data-bg=agua]>.wall{background:var(--agua-muro)}
[data-bg=agua]>.floor{background:var(--agua-piso)}
#bgnext{position:absolute;inset:0;display:none}

/* Cabecera: Archivo 700 · 28 px · +0.16 em */
#header{position:absolute;left:80px;top:270px;font-family:Archivo;font-weight:700;font-size:28px;line-height:36px;letter-spacing:.16em;text-transform:uppercase;z-index:20}
#header .marca{color:var(--tinta)}
#header .serie{color:var(--gris-calido)}
#header.inv .marca,#header.inv .serie{color:var(--papel)}

/* Panel de cifra: papel, filete 1 px gris de apoyo */
#panel{position:absolute;left:80px;top:400px;width:920px;max-height:450px;background:var(--papel);border:1px solid var(--gris-apoyo);padding:32px 48px 32px;color:var(--tinta);display:none;transform-origin:0 100%}
.lbl{font-family:Archivo;font-weight:600;font-size:40px;line-height:48px;letter-spacing:.14em;text-transform:uppercase}
.cifra{font-family:'Instrument Serif';font-weight:400;font-size:260px;line-height:260px;margin-bottom:8px;letter-spacing:-.01em;white-space:nowrap}
.cifra.m{font-size:220px;line-height:220px;margin-bottom:0}
.op{font-family:'Instrument Serif';font-weight:400;font-size:180px;line-height:180px;white-space:nowrap}
.ratio{display:grid;grid-template-columns:auto auto auto;align-items:end;column-gap:40px;justify-content:start}
.ratio .col{display:flex;flex-direction:column;gap:8px}
.ratio .arrow{padding-bottom:62px}
[data-a]{display:inline-block;transform-origin:0 100%}
.lbl[data-a],.cifra[data-a],.op[data-a]{display:block}
.col[data-a]{display:flex}
.q{transform-origin:50% 60%!important}

/* Texto de voz: caja papel que crece con la frase, alineada a la izquierda sobre el piso.
   Figtree 700 · 64/76 (mínimo del manual: 56/66). Remate en Instrument Serif itálica (como el video de referencia). */
#voz{position:absolute;left:80px;top:1352px;background:var(--papel);display:none;z-index:25;font-family:Figtree;font-weight:700;font-size:64px;line-height:76px;color:var(--tinta)}
#voz .in{position:absolute;left:0;top:0;padding:16px 30px 20px;white-space:nowrap}
#voz .ln{display:block}
#voz .w{display:inline-block;position:relative;z-index:0;transform-origin:0 80%}
#voz .serif{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-size:120px;line-height:110px;letter-spacing:-.01em}
#voz .ch{display:inline-block}
#voz .amb::before{content:"";position:absolute;left:-8px;bottom:8%;height:58%;width:calc(var(--w,0) * (100% + 16px));background:var(--ambar);z-index:-1}
#impacto .ch{display:inline-block}
#impacto .it{font-style:italic}

/* Pie: Archivo 400 · 24 px · tinta · ≤ 6 palabras */
#pie{position:absolute;left:80px;top:1610px;font-family:Archivo;font-weight:400;font-size:24px;line-height:32px;color:var(--tinta);opacity:0;z-index:25}

/* Personajes: misma escala de lienzo (k = 2.2 px por unidad del rig); origen = centro de la base, sobre el piso */
.char{position:absolute;z-index:10}
#michi,#canela{top:798.4px;width:510.4px;height:585.2px;transform-origin:255.2px 501.6px}
#michi{left:535.2px}
#canela{left:14.8px}
#michi svg,#canela svg{width:100%;height:100%;display:block;overflow:visible}
#frasco{left:410px;top:1058px;width:154px;height:253px;transform-origin:72.6px 242px;z-index:12}
#frasco svg,#candado svg{width:100%;height:100%;display:block}
#moneda{left:0;top:0;width:64px;height:64px;z-index:11;display:none}
#moneda img{width:100%;height:100%;display:block}
#candado{left:450px;top:1185px;width:66px;height:85px;display:none;z-index:13;transform-origin:32.6px 115px}

/* Pantalla de impacto: petróleo completo, sin personajes */
#impacto{position:absolute;inset:0;background:var(--petroleo);display:none;z-index:18;color:var(--papel)}
#impacto .big{position:absolute;left:80px;top:640px;font-family:'Instrument Serif';font-size:320px;line-height:300px}
#impacto .small{position:absolute;left:88px;top:980px;font-family:'Instrument Serif';font-size:130px;line-height:130px;white-space:nowrap}
#impacto .num{position:relative}
#impacto .strike{position:absolute;left:-6px;top:58%;height:10px;width:calc(var(--w,0) * (100% + 12px));background:var(--papel)}

/* ---------- Montaje: insertos ---------- */
#ins{position:absolute;inset:0;z-index:16;display:none;overflow:hidden}
.insIn{position:absolute;inset:0;transform-origin:50% 45%}
.insIn>*{position:absolute}
.wallF{inset:0}
.cuad{inset:0;background:var(--papel-hondo);background-image:repeating-linear-gradient(to bottom,transparent 0 71px,#C4BDB0 71px 72px)}
.cu,.cuWrap{position:absolute}
.cu svg{width:100%;height:100%;display:block;overflow:visible}
.bigjar{left:479.5px;top:365px;width:595px;height:977.5px;transform-origin:280.5px 935px}
.bigjar svg{width:100%;height:100%;display:block}
.coinBig{left:0;top:0;width:150px;height:150px}
.bill{left:0;top:0;width:260px;height:130px;transform-origin:50% 50%}
.coin{left:0;top:0;width:84px;height:84px;transform-origin:50% 50%}
.lblC{left:80px;font-family:Archivo;font-weight:600;font-size:40px;line-height:48px;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta)}
.cifC{left:80px;font-family:'Instrument Serif';font-size:220px;line-height:220px;color:var(--tinta);transform-origin:0 100%}
.barT{left:80px;width:920px;height:140px;background:var(--tinta);transform-origin:0 50%}
.barCut{left:0;width:220px;height:140px;background:var(--papel);border:4px dashed var(--tinta);transform-origin:50% 50%}
.qbig{left:80px;top:600px;font-family:'Instrument Serif';font-size:300px;line-height:300px;color:var(--tinta);white-space:nowrap}
.qbig .n,.qbig .qm{display:inline-block;transform-origin:0 100%}
.qbig .qm{font-style:italic;margin-left:12px}
.topeL{left:780px;top:400px;display:flex;flex-direction:column;align-items:center;gap:12px}
.topeL .dash{width:0;height:420px;border-left:8px dashed var(--tinta)}
.trayBox{left:560px;top:980px;width:440px;height:230px;background:var(--papel);border:1px solid var(--gris-apoyo);padding:20px 28px;transform-origin:50% 100%}
.rowG{inset:0}
.rowG>*{position:absolute}
.opC{left:80px;font-family:'Instrument Serif';font-size:190px;line-height:190px;color:var(--tinta);white-space:nowrap}
.opC span{display:inline-block;transform-origin:0 100%}
.opC .ch{display:inline-block}
.lockBig{left:666px;top:880px;width:190px;height:244px;transform-origin:95px 400px}
.lockBig svg{width:100%;height:100%;display:block}
/* Palabra gigante */
#big{position:absolute;left:80px;top:420px;z-index:25;display:none;font-family:Figtree;font-weight:800;font-size:170px;line-height:180px;color:var(--tinta);white-space:nowrap}
#big .bw{display:inline-block;transform-origin:0 80%}
#big.serif{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-size:260px;line-height:240px}
#big .ch{display:inline-block}

/* Guía de zona segura (solo revisión) */
#safe{position:absolute;inset:0;pointer-events:none;z-index:40;display:none}
#safe.on{display:block}
#safe::before,#safe::after{content:"";position:absolute;left:0;right:0;height:250px;background:rgba(154,59,46,.18);border-color:rgba(154,59,46,.8);border-style:dashed;border-width:0}
#safe::before{top:0;border-bottom-width:3px}
#safe::after{bottom:0;border-top-width:3px}

/* ---------- Controles (fuera del cuadro) ---------- */
#controls{display:flex;align-items:center;gap:12px;width:min(720px,calc(100vw - 32px));font-size:14px;flex-wrap:wrap}
body.capture #controls,body.capture #info{display:none}
#controls button{background:#E3DDD0;color:#05070A;border:0;padding:8px 14px;font:600 14px Archivo,sans-serif;cursor:pointer}
#controls button.alt{background:transparent;color:#E3DDD0;border:1px solid #8C8577}
#controls button.alt.active{background:#8C8577;color:#05070A}
#scrub{flex:1;min-width:160px;accent-color:#E8C46A}
#tc{font-variant-numeric:tabular-nums;min-width:120px}
#info{font-size:13px;color:#C9C4B8;width:min(720px,calc(100vw - 32px));display:flex;justify-content:space-between;gap:12px}
#fontwarn{position:fixed;inset:auto 16px 16px 16px;background:#9A3B2E;color:#F3EFE6;padding:12px 16px;font:600 14px Archivo,sans-serif;display:none;z-index:99}
</style>

    agitada:    { d: 'M34.8 -19.9C63 -14.9 48.1 -46.4 72.9 -56.4C86.2 -63 79.6 -79.6 89.5 -87.9', src: 'p.16' },
    erizada:    { d: 'M34.8 -23.2L50.9 -98.8', src: 'PROPUESTA: p.16 la engrosa ×1.6 (viola grosor constante). Aquí: trayectoria rígida casi vertical, mismo grosor. PENDIENTE' },
    escondida:  { d: null, src: 'p.16 (sin trazo visible)' },
  };

  // Patas: solo «señala» viene del PDF (p.18). El resto son propuestas del sistema (p.64: «solo en señala, celebra, sostiene, cubre»).
  const PAWS = {
    none: [],
    senala: [{ side: -1, d: 'M-33.18 -46.4C-56.4 -49.72 -66.36 -67.99 -61.35 -86.21', src: 'p.18' }],
    sostener: [{ side: -1, d: 'M-31 -42C-25 -31 -15 -28 -8 -33' }, { side: 1, d: 'M31 -42C25 -31 15 -28 8 -33' }],
    arriba: [{ side: -1, d: 'M-31 -52C-50 -60 -58 -80 -52 -98' }, { side: 1, d: 'M31 -52C50 -60 58 -80 52 -98' }],
    cubrir: [{ side: -1, d: 'M-30 -58C-40 -84 -34 -116 -20 -134' }, { side: 1, d: 'M30 -58C40 -84 34 -116 20 -134' }],
  };

  const POSES = {
    sentado: { eyeScale: 1, pupilH: 1, closed: 0, paws: 'none' },
    senala: { eyeScale: 1, pupilH: 1, closed: 0, paws: 'senala' },
    sorpresa: { eyeScale: G.eyeRSorpresa / G.eyeR, pupilH: 1.10, closed: 0, paws: 'none' }, // p.18: ojo 14.08 u, pupila 9.95 u
    dormido: { eyeScale: 1, pupilH: 1, closed: 1, paws: 'none' },
  };

  const NEUTRAL = {
    pose: 'sentado', eyeScale: 1, gazeX: 0, gazeY: 0, pupilW: 1, pupilH: 1,
    lidTopL: 0, lidTopR: 0, lidTiltL: 0, lidTiltR: 0, lidBotL: 0, lidBotR: 0, closed: 0,
    earL: 0, earR: 0, earLiftL: 0, earLiftR: 0, head: 0, headDy: 0,
    bodySx: 1, bodySy: 1, lean: 0, bodyDx: 0, tailWag: 0,
    tail: 'relajada', paws: 'none', tears: 'none',
  };
  // Límites de transformación (propuestos) que protegen la anatomía.
  const LIMITS = {
    gazeX: [-1, 1], gazeY: [-1, 1], pupilW: [0.28, 2], pupilH: [0.38, 1.6],
    lidTopL: [0, 1], lidTopR: [0, 1], lidTiltL: [-26, 26], lidTiltR: [-26, 26], lidBotL: [0, 0.6], lidBotR: [0, 0.6], closed: [0, 1],
    earL: [-8, 55], earR: [-8, 55], earLiftL: [0, 6], earLiftR: [0, 6], head: [-18, 18], headDy: [-4, 8],
    bodySx: [0.94, 1.08], bodySy: [0.86, 1.08], lean: [-7, 7], bodyDx: [-9, 9], eyeScale: [1, 1.2133], tailWag: [-8, 8],
  };
  const NUM = Object.keys(LIMITS);
  const DISCRETE = ['pose', 'tail', 'paws', 'tears'];

  function normalize(q) {
    const p = Object.assign({}, NEUTRAL, q || {});
    for (const k of NUM) { const [a, b] = LIMITS[k]; p[k] = Math.min(b, Math.max(a, +p[k] || 0)); }
    if (!TAILS[p.tail]) p.tail = 'relajada';
    if (!PAWS[p.paws]) p.paws = 'none';
    return p;
  }
  // Interpolación entre dos estados: numéricos lineales; discretos cambian en t=0.5 («cambio controlado», sin morphing).
  function lerp(a, b, t) {
    a = normalize(a); b = normalize(b); const o = {};
    for (const k of NUM) o[k] = a[k] + (b[k] - a[k]) * t;
    for (const k of DISCRETE) o[k] = t < 0.5 ? a[k] : b[k];
    return o;
  }

  const f = n => (Math.round(n * 100) / 100);
  let uid = 0;

  function drop(x, y, s) {
    return `M${f(x)} ${f(y - 3.2 * s)}C${f(x + 2.3 * s)} ${f(y - 0.3 * s)} ${f(x + 2.3 * s)} ${f(y + 2.4 * s)} ${f(x)} ${f(y + 2.4 * s)}C${f(x - 2.3 * s)} ${f(y + 2.4 * s)} ${f(x - 2.3 * s)} ${f(y - 0.3 * s)} ${f(x)} ${f(y - 3.2 * s)}Z`;
  }

  function eye(p, side, id, nm, hlColor) {
    const sg = side === 'L' ? -1 : 1, ex = sg * G.eyeX, ey = G.eyeY, r = G.eyeR * p.eyeScale;
    const rx = G.pupil.rx * p.pupilW * p.eyeScale, ry = G.pupil.ry * p.pupilH * p.eyeScale;
    const tx = Math.max(1.2, r - rx - 1.4), ty = Math.max(1, r - ry - 0.6);
    const px = ex + p.gazeX * tx, py = ey + p.gazeY * ty;
    const top = Math.max(p['lidTop' + side], p.closed), tilt = p['lidTilt' + side], bot = p['lidBot' + side];
    const yT = ey - r + top * 2 * r, yB = ey + r - bot * 2 * r, bulge = Math.min(bot, 0.5) * r * 0.55;
    const x0 = ex - r - 8, x1 = ex + r + 8, cid = `${id}-eye${side}`;
    const tears = p.tears, wet = tears === 'humedos' || tears === 'acumuladas' || tears === 'llanto';
    let s = `<g${nm('MICHI_EYE_' + side)}><clipPath id="${cid}"><circle cx="${f(ex)}" cy="${f(ey)}" r="${f(r)}"/></clipPath>`;
    const eyeClosed = p.closed >= 0.97 || top >= 0.97;
    if (!eyeClosed) {
      s += `<g clip-path="url(#${cid})">`;
      s += `<circle${nm('MICHI_IRIS_' + side)} cx="${f(ex)}" cy="${f(ey)}" r="${f(r)}" fill="${C.gold}"/>`;
      s += `<ellipse${nm('MICHI_PUPIL_' + side)} cx="${f(px)}" cy="${f(py)}" rx="${f(rx)}" ry="${f(ry)}" fill="${C.black}"/>`;
      const hr = G.hl.r * p.eyeScale * (wet ? 1.45 : 1);
      s += `<circle${nm('MICHI_HIGHLIGHT_' + side)} cx="${f(ex + G.hl.dx * p.eyeScale)}" cy="${f(ey + G.hl.dy * p.eyeScale)}" r="${f(hr)}" fill="${hlColor}"/>`;
      s += `<path${nm('MICHI_LID_BOTTOM_' + side)} d="M${f(x0)} ${f(yB + bulge)}Q${f(ex)} ${f(yB - bulge)} ${f(x1)} ${f(yB + bulge)}L${f(x1)} ${f(ey + r + 20)}L${f(x0)} ${f(ey + r + 20)}Z" fill="${C.black}"/>`;
      if (wet) s += `<path d="M${f(x0)} ${f(yB + bulge - 1.1)}Q${f(ex)} ${f(yB - bulge - 1.1)} ${f(x1)} ${f(yB + bulge - 1.1)}" fill="none" stroke="${C.paper}" stroke-width="1.3" stroke-opacity="0.9"/>`;
      if (tears === 'acumuladas' || tears === 'llanto') s += `<path d="M${f(x0)} ${f(yB + bulge)}Q${f(ex)} ${f(yB - bulge)} ${f(x1)} ${f(yB + bulge)}L${f(x1)} ${f(yB + bulge - 3.6)}Q${f(ex)} ${f(yB - bulge - 3.6)} ${f(x0)} ${f(yB + bulge - 3.6)}Z" fill="${C.paper}" fill-opacity="0.92"/>`;
      s += `<rect${nm('MICHI_LID_TOP_' + side)} x="${f(x0)}" y="${f(ey - r - 40)}" width="${f(x1 - x0)}" height="${f(yT - (ey - r - 40))}" fill="${C.black}" transform="rotate(${f(sg * tilt)} ${f(ex)} ${f(yT)})"/>`;
      s += `</g>`;
    } else {
      s += `<path d="${G.closedL}" transform="translate(${f(ex)} ${f(ey)})${sg > 0 ? ' scale(-1 1)' : ''}" fill="none" stroke="${C.gold}" stroke-opacity="${G.lineOp}" stroke-width="${G.closedW}" stroke-linecap="round"/>`;
    }
    return s + `</g>`;
  }

  function tearsLayer(p, side, nm) {
    const sg = side === 'L' ? -1 : 1, ex = sg * G.eyeX, r = G.eyeR * p.eyeScale, yb = G.eyeY + r;
    const t = p.tears, P = C.paper; let s = '';
    const D = (x, y, k) => `<path d="${drop(x, y, k)}" fill="${P}"/>`;
    if (t === 'una' && side === 'L') s += D(ex + sg * r * 0.4, yb + 5, 0.9);
    if (t === 'dos') s += D(ex + sg * r * 0.4, yb + 5, 0.9);
    if (t === 'pocas') { if (side === 'L') { s += D(ex + sg * r * 0.42, yb + 2.5, 0.7) + D(ex + sg * r * 0.5, yb + 13, 0.95); } else s += D(ex + sg * r * 0.4, yb + 5, 0.85); }
    if (t === 'llanto') s += `<path d="M${f(ex + sg * r * 0.35)} ${f(yb - 2)}C${f(ex + sg * r * 0.4)} ${f(yb + 8)} ${f(ex + sg * r * 0.3)} ${f(yb + 16)} ${f(ex + sg * r * 0.36)} ${f(yb + 22)}" fill="none" stroke="${P}" stroke-width="2.6" stroke-linecap="round"/>` + D(ex + sg * r * 0.36, yb + 27, 1.05);
    return `<g${nm('MICHI_TEARS_' + side)}>${s}</g>`;
  }

  /* render(params, opts) → string SVG.
     opts: id (prefijo único de máscaras), layerIds (ids reales de capa, solo para una instancia), silhouette (contorno puro),
           highlight (#FFFFFF canónico p.11 | #F3EFE6), viewBox, width, height, jitter [dx,dy], bare (sin <svg>), title */
  function render(q, o) {
    o = o || {}; const p = normalize(q); const id = o.id || ('mi' + (++uid));
    const nm = n => o.layerIds ? ` id="${n}"` : ` data-layer="${n}"`;
    const B = C.black, hlc = o.highlight || C.white, sil = !!o.silhouette;
    const a = p.lean * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    const M = (x, y) => [p.bodyDx + ca * x * p.bodySx - sa * y * p.bodySy, sa * x * p.bodySx + ca * y * p.bodySy];
    const sh = pt => { const m = M(pt[0], pt[1]); return [m[0] - pt[0], m[1] - pt[1]]; };
    const hs = sh(G.bodyTop), ts = sh(G.tailRoot);
    const tail = TAILS[p.tail];
    const tailEl = tail.d ? `<g${nm('MICHI_TAIL')} transform="translate(${f(ts[0])} ${f(ts[1])}) rotate(${f(p.lean + p.tailWag)} ${G.tailRoot[0]} ${G.tailRoot[1]})"><path d="${tail.d}" fill="none" stroke="${B}" stroke-width="${G.tailW}" stroke-linecap="round" stroke-linejoin="round"/></g>` : `<g${nm('MICHI_TAIL')}></g>`;
    const pawEls = PAWS[p.paws].map(pw => { const anc = [pw.side * 32, -48], t = sh(anc); return `<g transform="translate(${f(t[0])} ${f(t[1])}) rotate(${f(p.lean)} ${anc[0]} ${anc[1]})"><path d="${pw.d}" fill="none" stroke="${B}" stroke-width="${G.pawW}" stroke-linecap="round" stroke-linejoin="round"/></g>`; }).join('');
    const earT = s => { const sg = s === 'L' ? -1 : 1; return `translate(0 ${f(-p['earLift' + s])}) rotate(${f(sg * p['ear' + s])} ${f(sg * -G.earPivot[0])} ${G.earPivot[1]})`; };
    const earPath = s => { const sg = s === 'L' ? 1 : -1; return 'M' + G.earL.map(([x, y]) => `${f(x * sg)} ${y}`).join('L') + 'Z'; };
    const H = G.head;
    let face = '';
    if (!sil) {
      const wl = (arr) => arr.map(d => `<path d="${d}" fill="none" stroke="${C.gold}" stroke-opacity="${G.lineOp}" stroke-width="${G.whiskW}" stroke-linecap="round"/>`).join('');
      face += `<g${nm('MICHI_WHISKERS_L')}>${wl(G.whiskL)}</g><g${nm('MICHI_WHISKERS_R')}>${wl(G.whiskR)}</g>`;
      face += eye(p, 'L', id, nm, hlc) + eye(p, 'R', id, nm, hlc);
      face += `<path${nm('MICHI_NOSE')} d="${G.nose}" fill="${C.gold}" fill-opacity="${G.noseOp}"/>`;
      face += `<g${nm('MICHI_MOUTH')}><path d="${G.mouthL}" fill="none" stroke="${C.gold}" stroke-opacity="${G.lineOp}" stroke-width="${G.mouthW}" stroke-linecap="round"/><path d="${G.mouthR}" fill="none" stroke="${C.gold}" stroke-opacity="${G.lineOp}" stroke-width="${G.mouthW}" stroke-linecap="round"/></g>`;
      face += tearsLayer(p, 'L', nm) + tearsLayer(p, 'R', nm);
    }
    const head = `<g${nm('MICHI_HEAD')} transform="translate(${f(hs[0])} ${f(hs[1])}) rotate(${f(p.lean + p.head)} ${G.neck[0]} ${G.neck[1]}) translate(0 ${f(p.headDy)})">`
      + `<g${nm('MICHI_EAR_L')} transform="${earT('L')}"><path d="${earPath('L')}" fill="${B}"/></g>`
      + `<g${nm('MICHI_EAR_R')} transform="${earT('R')}"><path d="${earPath('R')}" fill="${B}"/></g>`
      + `<rect${nm('MICHI_HEAD_SHAPE')} x="${H.x}" y="${H.y}" width="${H.w}" height="${H.h}" rx="${H.r}" fill="${B}"/>`
      + face + `</g>`;
    const body = `<g${nm('MICHI_BODY')} transform="translate(${f(p.bodyDx)} 0) rotate(${f(p.lean)}) scale(${f(p.bodySx)} ${f(p.bodySy)})"><path d="${G.body}" fill="${B}"/></g>`;
    const j = o.jitter || [0, 0];
    const inner = `<g${nm('MICHI_ROOT')} transform="translate(${f(j[0])} ${f(j[1])})">`
      + (tail.front ? '' : tailEl) + `<g${nm('MICHI_PAWS_BACK')}></g>` + body + (tail.front ? tailEl : '') + head
      + `<g${nm('MICHI_PAWS_FRONT')}>${pawEls}</g></g>`;
    if (o.bare) return inner;
    const vb = o.viewBox || VIEWBOX;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb}"${o.width ? ` width="${o.width}"` : ''}${o.height ? ` height="${o.height}"` : ''} style="display:block;overflow:visible">${o.title ? `<title>${o.title}</title>` : ''}${inner}</svg>`;
  }
  const VIEWBOX = '-116 -228 232 266';

  // ---- Objetos del universo (fuera de la geometría del personaje). Coordenadas de escena. ----
  const OBJ = {
    head(x, y, s, eyeFill, pupil, whisk) { // retrato plano de MICHI
      const e = [[-18.24, -135.95], [18.24, -135.95]];
      let g = `<g transform="translate(${x} ${y}) scale(${s}) translate(0 137)">`;
      g += `<path d="M-36.47 -150.87L-43.11 -198.95L-1.66 -172.42Z" fill="${C.black}"/><path d="M36.47 -150.87L43.11 -198.95L1.66 -172.42Z" fill="${C.black}"/>`;
      g += `<rect x="-41.45" y="-175.74" width="82.9" height="76.27" rx="24.87" fill="${C.black}"/>`;
      if (whisk) g += ['M-36 -125L-72 -133', 'M-36 -118L-70 -108', 'M36 -125L72 -133', 'M36 -118L70 -108'].map(d => `<path d="${d}" stroke="${whisk}" stroke-width="3.2" stroke-linecap="round"/>`).join('');
      g += e.map(([ex, ey]) => `<circle cx="${ex}" cy="${ey}" r="12.5" fill="${eyeFill}"/>` + (pupil ? `<circle cx="${ex}" cy="${ey}" r="5" fill="${C.black}"/>` : '')).join('');
      return g + `</g>`;
    },
    coin(x, y, r) {
      return `<g><circle cx="${x}" cy="${y}" r="${r}" fill="${C.gold}" stroke="#141820" stroke-width="${f(r * 0.06)}"/><circle cx="${x}" cy="${y}" r="${f(r * 0.84)}" fill="none" stroke="#141820" stroke-opacity="0.55" stroke-width="${f(r * 0.022)}" stroke-dasharray="${f(r * 0.06)} ${f(r * 0.05)}"/>`
        + `<text x="${x}" y="${f(y - r * 0.42)}" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="${f(r * 0.34)}" fill="#141820">1</text>`
        + OBJ.head(x, y + r * 0.06, r * 0.0052, C.gold, false)
        + (r > 18 ? `<text x="${x}" y="${f(y + r * 0.66)}" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700" letter-spacing="${f(r * 0.03)}" font-size="${f(r * 0.15)}" fill="#141820">CATCOIN</text>` : '') + `</g>`;
    },
    coinSide(x, y, w) { // moneda de canto, para pilas
      const h = w * 0.16;
      return `<rect x="${f(x - w / 2)}" y="${f(y - h)}" width="${f(w)}" height="${f(h)}" rx="${f(h * 0.45)}" fill="${C.gold}" stroke="#141820" stroke-opacity="0.6" stroke-width="${f(w * 0.018)}"/>`;
    },
    stack(x, y, w, n) { let s = '<g>'; const h = w * 0.16; for (let i = 0; i < n; i++) s += OBJ.coinSide(x + ((i * 37) % 5 - 2) * w * 0.012, y - i * h * 0.92, w); return s + '</g>'; },
    bill(x, y, w, v) {
      const h = w * 0.47, x0 = x - w / 2, y0 = y - h / 2, k = w / 100;
      return `<g><rect x="${f(x0)}" y="${f(y0)}" width="${f(w)}" height="${f(h)}" rx="${f(3 * k)}" fill="${C.paper}" stroke="#141820" stroke-width="${f(1.8 * k)}"/>`
        + `<rect x="${f(x0 + 4.5 * k)}" y="${f(y0 + 4.5 * k)}" width="${f(w - 9 * k)}" height="${f(h - 9 * k)}" rx="${f(2 * k)}" fill="none" stroke="#8C8A84" stroke-width="${f(0.7 * k)}"/>`
        + `<text x="${f(x0 + 10 * k)}" y="${f(y0 + 13 * k)}" font-family="Archivo, sans-serif" font-weight="700" font-size="${f(4.6 * k)}" fill="${C.gold}">$$$</text>`
        + `<text x="${f(x0 + w - 10 * k)}" y="${f(y0 + h - 8 * k)}" text-anchor="end" font-family="Archivo, sans-serif" font-weight="700" font-size="${f(4.6 * k)}" fill="${C.gold}">$$$</text>`
        + `<text x="${f(x0 + 11 * k)}" y="${f(y0 + 30 * k)}" font-family="Anton, Impact, sans-serif" font-size="${f(18 * k)}" fill="#141820">${v || 100}</text>`
        + `<text x="${f(x0 + 12 * k)}" y="${f(y0 + 38.5 * k)}" font-family="Archivo, sans-serif" font-weight="700" letter-spacing="${f(0.9 * k)}" font-size="${f(3.6 * k)}" fill="#3A3F48">CATDÓLARES</text>`
        + `<circle cx="${f(x0 + 69 * k)}" cy="${f(y0 + h / 2)}" r="${f(15 * k)}" fill="none" stroke="#8C8A84" stroke-width="${f(0.9 * k)}"/>`
        + OBJ.head(x0 + 69 * k, y0 + h / 2 + 1.5 * k, 0.1 * k, C.paper, true, '#3A3F48') + `</g>`;
    },
    box(x, y, w, h, label) {
      return `<g><rect x="${f(x - w / 2)}" y="${f(y - h)}" width="${f(w)}" height="${f(h)}" fill="${C.surface}"/><rect x="${f(x - w / 2)}" y="${f(y - h)}" width="${f(w)}" height="${f(h * 0.08)}" fill="#3A4556"/>`
        + (label ? `<text x="${x}" y="${f(y - h * 0.45)}" text-anchor="middle" font-family="Archivo, sans-serif" font-weight="700" letter-spacing="${f(w * 0.02)}" font-size="${f(w * 0.12)}" fill="${C.paper}" fill-opacity="0.7">${label}</text>` : '') + `</g>`;
    },
    jar(x, y, w, fill) {
      const h = w * 1.25; let s = `<g><rect x="${f(x - w / 2)}" y="${f(y - h)}" width="${f(w)}" height="${f(h)}" rx="${f(w * 0.14)}" fill="${C.cold}" fill-opacity="0.12" stroke="${C.cold}" stroke-width="${f(w * 0.03)}"/><rect x="${f(x - w * 0.36)}" y="${f(y - h - w * 0.1)}" width="${f(w * 0.72)}" height="${f(w * 0.12)}" rx="2" fill="${C.surface}"/>`;
      const n = Math.round(fill * 7); for (let i = 0; i < n; i++) s += OBJ.coinSide(x + (i % 2 ? 0.08 : -0.08) * w, y - w * 0.06 - i * w * 0.14, w * 0.7);
      return s + '</g>';
    },
    phone(x, y, w) { const h = w * 1.9; return `<g><rect x="${f(x - w / 2)}" y="${f(y - h)}" width="${f(w)}" height="${f(h)}" rx="${f(w * 0.14)}" fill="#11151B" stroke="${C.surface}" stroke-width="${f(w * 0.04)}"/><rect x="${f(x - w * 0.4)}" y="${f(y - h + w * 0.14)}" width="${f(w * 0.8)}" height="${f(h - w * 0.28)}" rx="${f(w * 0.06)}" fill="${C.cold}"/><text x="${x}" y="${f(y - h * 0.46)}" text-anchor="middle" font-family="Anton, Impact, sans-serif" font-size="${f(w * 0.34)}" fill="#11151B">−12</text></g>`; },
    calendar(x, y, w) { const h = w * 0.95; let s = `<g><rect x="${f(x - w / 2)}" y="${f(y - h)}" width="${f(w)}" height="${f(h)}" rx="${f(w * 0.04)}" fill="${C.paper}"/><rect x="${f(x - w / 2)}" y="${f(y - h)}" width="${f(w)}" height="${f(h * 0.18)}" fill="${C.surface}"/>`;
      for (let r = 0; r < 4; r++) for (let c = 0; c < 5; c++) { const lit = r === 2 && c === 3; s += `<rect x="${f(x - w * 0.42 + c * w * 0.17)}" y="${f(y - h * 0.74 + r * h * 0.17)}" width="${f(w * 0.13)}" height="${f(h * 0.12)}" fill="${lit ? C.gold : '#D8D3C8'}"/>`; }
      return s + '</g>'; },

    html: () => `<div class="cuad"></div><div class="lblC" style="top:470px">Lo que declaras</div><div class="barT" style="top:560px;left:-200px;width:880px;height:190px"></div>` +
      `<div class="topeL"><div class="lblC" style="position:static">Tope</div><div class="dash"></div></div>` + Array.from({ length: 4 }, (_, i) => bill('t' + i)).join(''),
    upd(lt, t, r) {
      const L = r.querySelector('.topeL'), x = lt - .45;
      L.style.opacity = x < 0 ? 0 : 1; L.style.transform = `translateY(${x < 0 ? -500 : -500 * (1 - outBounce(clamp(x / .5)))}px)`;
      r.querySelectorAll('.bill').forEach((b, i) => {
        const y = lt - .95 - i * .06, u = clamp(y / .35), stop = 800 + i * 26;
        const xx = 1200 + (stop - 1200) * outBack(u, 1.4) - (y > .35 ? 0 : 0);
        b.style.opacity = y < 0 ? 0 : 1; b.style.transform = `translate(${xx}px, ${600 + i * 8}px) rotate(${i % 2 ? 3 : -3}deg) scale(1.1)`;
      });
    } },
  peek: {
    html: t => `<div class="wallF" data-bg="agua"><div class="wall" style="height:100%"></div></div><div class="cuWrap"></div>`,
    upd(lt, t, r) { const y = 1640 + 460 * (1 - pop(lt - .1, .4, 1.6)); r.querySelector('.cuWrap').innerHTML = michiCU(t, 'mcu2', 5.4, 790, y + 137 * 5.4); } },
  coins: {
    html: () => `<div class="cuad"></div><div class="lblC" style="top:500px">Por cada</div><div class="cifC" style="top:550px">100</div>` + Array.from({ length: 10 }, (_, i) => coin('c' + i)).join(''),
    upd(lt, t, r) {
      r.querySelector('.lblC').style.opacity = clamp(lt / .2);
      const c = r.querySelector('.cifC'), x = lt - .96; c.style.opacity = x < 0 ? 0 : 1; c.style.transform = `scale(${1.45 - .45 * pop(x, .32)})`;
      r.querySelectorAll('.coin').forEach((e, i) => { const p = pop(lt - .1 - i * .05, .28, 2.4); e.style.opacity = p > 0 ? 1 : 0;
        e.style.transform = `translate(${80 + i * 92}px, ${880 + (1 - p) * 60}px) scale(${p})`; });
    } },
  tray: {
    html: () => `<div class="cuad"></div><div class="cifC" style="top:470px;font-size:150px;line-height:150px">100</div>` +
      `<div class="trayBox"><div class="lblC t1" style="position:static">Impuesto</div></div><div class="cifC c30" style="top:1010px;left:110px">30</div>` + Array.from({ length: 10 }, (_, i) => coin('c' + i)).join(''),
    upd(lt, t, r) {
      r.querySelectorAll('.coin').forEach((e, i) => {
        let x = 80 + i * 92, y = 680;
        if (i >= 7) { const j = i - 7, u = clamp((lt - .04 - j * .09) / .45), e2 = inOut(u);
          const tx = 600 + j * 112, ty = 1080; x = x + (tx - x) * e2; y = y + (ty - y) * e2 - 260 * Math.sin(Math.PI * u); }
        e.style.transform = `translate(${x}px, ${y}px) scale(1.1)`; });
      const c = r.querySelector('.c30'), x = lt - .32; c.style.opacity = x < 0 ? 0 : 1; c.style.transform = `scale(${1.45 - .45 * pop(x, .32)})`;
      r.querySelector('.trayBox').style.transform = `scale(${.9 + .1 * pop(lt, .25)})`;
    } },
  ahorras: {
    html: () => `<div class="cuad"></div><div class="rowG"><div class="cifC" style="top:470px;font-size:150px;line-height:150px">100</div>` +
      Array.from({ length: 7 }, (_, i) => coin('c' + i)).join('') + `</div>` +
      `<div class="trayBox"><div class="lblC t1" style="position:static">Impuesto</div><div class="lblC t2" style="position:static">Te ahorras</div></div>` +
      Array.from({ length: 3 }, (_, j) => coin('d' + j)).join('') + `<div class="cifC c30" style="top:1010px;left:110px">30</div>`,
    upd(lt, t, r) {
      const out = outCubic(clamp((lt - 1.44) / .45));      // 20.96 «que restas»: las 7 monedas del renglón salen
      r.querySelector('.rowG').style.transform = `translateX(${-1100 * out}px)`;
      r.querySelectorAll('.rowG .coin').forEach((e, i) => e.style.transform = `translate(${80 + i * 92}px, 680px) scale(1.1)`);
      const sw = clamp((lt - 2.40) / .3);                    // 21.92 «te ahorras»: cambia la etiqueta de la charola
      const t1 = r.querySelector('.t1'), t2 = r.querySelector('.t2');
      t1.style.display = sw < .5 ? 'block' : 'none'; t2.style.display = sw >= .5 ? 'block' : 'none';
      t1.style.transform = `translateY(${-30 * sw}px)`; t1.style.opacity = 1 - sw * 2; t2.style.transform = `translateY(${30 * (1 - sw)}px)`;
      r.querySelectorAll('.coin[class*="d"]').forEach((e, j) => {
        const h = (lt > 2.40 + j * .08 && lt < 2.40 + j * .08 + .34) ? -90 * Math.sin(Math.PI * (lt - 2.40 - j * .08) / .34) : 0;
        e.style.transform = `translate(${600 + j * 112}px, ${1080 + h}px) scale(1.1)`; });
      const c = r.querySelector('.c30'), p = (lt > 3.36 && lt < 3.76) ? 1 + .25 * Math.sin(Math.PI * (lt - 3.36) / .4) : 1;
      c.style.transform = `scale(${p})`;
    } },
  op: {
    html: () => `<div class="cuad"></div><div class="opC" style="top:560px"><span class="ty">10,000 ÷ 100</span></div><div class="opC" style="top:770px"><span class="eq">= </span><span class="qq">?</span><span class="ans">100</span></div>`,
    upd(lt, t, r) {
      const ty = r.querySelector('.ty');
      if (!ty.dataset.split) { ty.innerHTML = [...ty.textContent].map(c => `<span class="ch">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); ty.dataset.split = 1; }
      letters(ty, lt, 40, .045);
      const eq = r.querySelector('.eq'), qq = r.querySelector('.qq'), an = r.querySelector('.ans'), x = lt - .8;
      eq.style.opacity = x < 0 ? 0 : clamp(x / .1);
      const ansOn = lt >= 2.40;
      qq.style.display = ansOn ? 'none' : 'inline-block'; an.style.display = ansOn ? 'inline-block' : 'none';
      qq.style.opacity = x < .1 ? 0 : 1; qq.style.transform = `scale(${1 + .12 * Math.sin(2 * Math.PI * (x - .1) / .9)})`;
      an.style.transform = `scale(${1.6 - .6 * pop(lt - 2.40, .32, 2.6)})`;
    } },
  jarBills: {
    html: () => jarScene('agua', Array.from({ length: 10 }, (_, i) => bill('j' + i)).join('')),
    upd(lt, t, r) {
      r.querySelectorAll('.bill').forEach((b, i) => {
        const u = clamp((lt - i * .05) / .42), sx = i % 2 ? -200 : 1100, e = inOut(u);
        const x = sx + (630 - sx) * e, y = 470 - 120 * Math.sin(Math.PI * u) + 460 * u * u;
        b.style.opacity = u > 0 && u < 1 ? 1 : 0; b.style.transform = `translate(${x}px, ${y}px) rotate(${(i % 2 ? 1 : -1) * 260 * u}deg) scale(.8)`; });
      r.querySelector('.bigjar').style.transform = `rotate(${wobble(lt, .7, 4)}deg)`;
    } },
  impuesto: {
    html: () => `<div class="cuad"></div><div class="lblC" style="top:540px">Tu impuesto</div><div class="barT" style="top:620px"></div><div class="barCut" style="top:620px"></div>`,
    upd(lt, t, r) {
      const bar = r.querySelector('.barT'), cut = r.querySelector('.barCut'), x = lt - .96;   // 35.72 «impuesto»
      r.querySelector('.lblC').style.opacity = clamp(lt / .2);
      bar.style.width = (x < 0 ? 920 : 920 - 220 * outCubic(clamp(x / .35))) + 'px';
      cut.style.opacity = x < 0 ? 0 : 1 - clamp((x - .3) / .3);
      cut.style.transform = `translate(${780}px, ${x < 0 ? 0 : 500 * Math.pow(clamp(x / .6), 2)}px) rotate(${x < 0 ? 0 : 25 * clamp(x / .6)}deg)`;
    } },
  michiCU2: {
    html: t => `<div class="wallF" data-bg="agua"><div class="wall" style="height:100%"></div></div><div class="cuWrap"></div>`,
    upd(lt, t, r) { const k = 6.0 + .5 * outCubic(clamp(lt / 1.8)); r.querySelector('.cuWrap').innerHTML = michiCU(t, 'mcu3', k, 560, 1060 + 137 * k); } },
  jarLock: {
    html: () => jarScene('arcilla', '', `<div class="lockBig">${LOCK}</div>`),
    upd(lt, t, r) {
      const x = lt - 1.92, L = r.querySelector('.lockBig');               // 41.84 cae el candado
      L.style.opacity = x < 0 ? 0 : 1; L.style.transform = `translateY(${x < 0 ? -900 : -900 * (1 - outBounce(clamp(x / .5)))}px) rotate(${wobble(lt, 2.30, 4)}deg)`;
      r.querySelector('.bigjar').style.transform = `rotate(${wobble(lt, 2.30, 4)}deg) scaleY(${x > .3 && x < .5 ? 1 - .05 * Math.sin(Math.PI * (x - .3) / .2) : 1})`;
    } },
};
function renderIns(t) {
  const I = INS.find(s => t >= s.t0 && t < s.t1), el = $('ins');
  set('ins', I ? I.k : '', k => { el.innerHTML = k ? `<div class="insIn">${SCENES[k].html(t)}</div>` : ''; });
  show(el, !!I);
  if (!I) return;
  const lt = t - I.t0, inn = el.firstChild;
  inn.style.transform = `scale(${1.06 - .06 * outCubic(clamp(lt / .35))})`;   // cada corte entra con un pequeño asentamiento
  SCENES[I.k].upd(lt, t, inn);
}

// Palabra gigante, una a la vez (frases con modo «big»).
function renderBig(t) {
  const el = $('big'), f = FRASES.find(f => f.big && t >= f.start - .04 && t < f.end);
  if (!f) { show(el, false); set('bigW', '', () => {}); return; }
  let i = 0; f.words.forEach((w, k) => { if (t >= w.t - .04) i = k; });
  const w = f.words[i];
  set('bigW', FRASES.indexOf(f) + ':' + i, () => {
    el.className = w.serif ? 'serif' : '';
    el.innerHTML = w.serif ? [...w.text].map(c => `<span class="ch">${c}</span>`).join('') : `<span class="bw">${w.text}</span>`;
  });
  show(el, true);
  const x = t - (w.t - .04), q = clamp((t - (f.end - EXIT)) / EXIT);
  el.style.opacity = 1 - q; el.style.filter = q > 0 ? `blur(${q * 14}px)` : '';
  if (w.serif) letters(el, x, 70, .04);
  else { const b = el.firstChild.style; b.opacity = clamp(x / .1); b.filter = x < .16 ? `blur(${(1 - x / .16) * 12}px)` : '';
    b.transform = `translateY(${(1 - outCubic(clamp(x / .22))) * 30}px) scale(${1.25 - .25 * outBack(clamp(x / .25), 2)})`; }
}

function renderAt(t) {
  t = Math.max(0, Math.min(DUR, t));
  renderBG(t);
  const r = renderImpact(t);
  set('chars', r < 2300, v => show($('chars'), v));
  if (r < 2300) renderChars(t);
  renderPanel(t);
  renderIns(t);
  renderBig(t);
  renderVoz(t);
  $('pie').style.opacity = (t >= PIE[0] && t < PIE[1] + .3) ? clamp((t - PIE[0]) / .25) : 0;
  set('fase', at(FASES, t), v => $('fase').textContent = v);
  $('tc').textContent = t.toFixed(2).padStart(5, '0') + ' / 45.00 s';
  $('scrub').value = t;
}
window.renderAt = renderAt;
window.ANIMATIC_DUR = DUR;

/* =================== Escala y reproducción =================== */
const capture = new URLSearchParams(location.search).has('capture');
if (capture) document.body.classList.add('capture');
function fit() { const w = $('viewport').clientWidth; stage.style.transform = `scale(${w / 1080})`; }
addEventListener('resize', fit); fit();

let playing = false, t0 = 0, tStart = 0, cur = 0;
function loop(now) { if (!playing) return; cur = tStart + (now - t0) / 1000; if (cur >= DUR) { cur = DUR; playing = false; $('play').textContent = '▶ Reproducir'; } renderAt(cur); if (playing) requestAnimationFrame(loop); }
$('play').onclick = () => { if (playing) { playing = false; $('play').textContent = '▶ Reproducir'; return; }
  if (cur >= DUR) cur = 0; playing = true; tStart = cur; t0 = performance.now(); $('play').textContent = '❚❚ Pausa'; requestAnimationFrame(loop); };
$('scrub').oninput = e => { playing = false; $('play').textContent = '▶ Reproducir'; cur = +e.target.value; renderAt(cur); };
$('safeBtn').onclick = () => { const on = $('safe').classList.toggle('on'); $('safeBtn').classList.toggle('active', on); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight') { cur = Math.min(DUR, cur + (e.shiftKey ? 1 : 1 / 30)); renderAt(cur); }
  if (e.code === 'ArrowLeft') { cur = Math.max(0, cur - (e.shiftKey ? 1 : 1 / 30)); renderAt(cur); } });

/* =================== Tipografías: sin sustituciones silenciosas =================== */
const FONTS = ['700 28px Archivo', '400 24px Archivo', '600 40px Archivo', '400 100px "Instrument Serif"', 'italic 400 100px "Instrument Serif"', '700 64px Figtree'];
window.fontsOK = document.fonts.ready.then(() => Promise.all(FONTS.map(f => document.fonts.load(f, 'Aa0,÷×¿ó')))).then(() => {
  const ok = FONTS.every(f => document.fonts.check(f, 'Aa0'));
  if (!ok) $('fontwarn').style.display = 'block';
  fontsReady = ok; renderAt(cur);   // vuelve a medir las cajas con las letras reales
  return ok;
});
renderAt(0);
})();
</script>
