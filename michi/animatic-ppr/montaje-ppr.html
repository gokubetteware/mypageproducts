:root{
  --papel:#F3EFE6; --papel-hondo:#E3DDD0; --tinta:#05070A; --ambar:#E8C46A;
  --gris-calido:#5E5A52; --gris-apoyo:#8C8577;
  --arcilla-muro:#EDD2BC; --arcilla-piso:#E1BEA3; --agua-muro:#B7D3CF; --agua-piso:#9FC2BD; --petroleo:#1E5652;
  --piso:1300px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#2a2925;color:#E3DDD0;font-family:Archivo,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;overflow:hidden}
body.capture{background:#000;padding:0;display:block}

/* ---------- Escenario 1080 × 1920 (en 4K se rasteriza al doble, no se escala un video) ---------- */
#viewport{position:relative;width:min(calc((100vh - 140px) * 9 / 16), calc(100vw - 32px));aspect-ratio:9/16}
body.capture #viewport{width:1080px;height:1920px}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;overflow:hidden;font-feature-settings:"tnum" 1,"lnum" 1;background:var(--arcilla-muro)}
.wall{position:absolute;left:0;top:0;width:100%;height:var(--piso)}
.floor{position:absolute;left:0;top:var(--piso);width:100%;bottom:0}
[data-bg=arcilla]>.wall{background:var(--arcilla-muro)}
[data-bg=arcilla]>.floor{background:var(--arcilla-piso)}
[data-bg=agua]>.wall{background:var(--agua-muro)}
[data-bg=agua]>.floor{background:var(--agua-piso)}

/* Plano general */
#wide{position:absolute;inset:0;transform-origin:790px 1050px}
#bgnext{position:absolute;inset:0;display:none}
.char{position:absolute;z-index:10}
#michi,#canela{top:798.4px;width:510.4px;height:585.2px;transform-origin:255.2px 501.6px}
#michi{left:535.2px}
#canela{left:14.8px}
#michi svg,#canela svg,.cu svg{width:100%;height:100%;display:block;overflow:visible}
#frasco{left:410px;top:1058px;width:154px;height:253px;transform-origin:72.6px 242px;z-index:12}
#frasco svg,#candado svg,.bigjar svg,.lockBig svg{width:100%;height:100%;display:block}
#candado{left:450px;top:1185px;width:66px;height:85px;display:none;z-index:13}
#wbills{position:absolute;inset:0;z-index:11}
#wbills img{position:absolute;left:0;top:0;width:110px;height:55px;display:none}
#panel{position:absolute;left:80px;top:430px;width:920px;background:var(--papel);border:1px solid var(--gris-apoyo);padding:28px 48px 30px;color:var(--tinta);display:none;transform-origin:0 100%;z-index:14}

/* Tipos comunes */
.lbl{font-family:Archivo;font-weight:600;font-size:40px;line-height:48px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta)}
.cifra{font-family:'Instrument Serif';font-weight:400;font-size:230px;line-height:230px;margin:4px 0 6px;letter-spacing:-.01em;white-space:nowrap;color:var(--tinta)}
[data-a]{display:inline-block;transform-origin:0 100%}
.lbl[data-a],.cifra[data-a]{display:block}

/* Insertos */
#ins{position:absolute;inset:0;z-index:16;display:none;overflow:hidden}
.insIn{position:absolute;inset:0;transform-origin:50% 45%}
.insIn>*{position:absolute}
.insIn .cifra,.insIn .chipR,.insIn .lbl,.insIn .card{transform-origin:0 100%}
.wallF{inset:0}
.cuad{inset:0;background:var(--papel-hondo);background-image:repeating-linear-gradient(to bottom,transparent 0 71px,#C4BDB0 71px 72px)}
.cu{position:absolute}
.bigjar{left:479.5px;top:365px;width:595px;height:977.5px;transform-origin:280.5px 935px}
.lockBig{left:666px;top:880px;width:190px;height:244px}
.coinBig{left:330px;top:470px;width:420px;height:420px}
.bill{left:0;top:0;width:150px;height:75px;transform-origin:50% 50%}
.coin{left:0;top:0;width:88px;height:88px;transform-origin:50% 50%}
.card{background:var(--papel);border:1px solid var(--gris-apoyo);padding:24px 32px}
.txtB{font-family:Archivo;font-weight:700;font-size:52px;line-height:62px;color:var(--tinta)}
.chipR{background:var(--papel);border:1px solid var(--gris-apoyo);padding:10px 20px;font-family:Archivo;font-weight:700;font-size:40px;line-height:48px;color:var(--tinta)}
.barT{left:80px;width:920px;height:150px;background:var(--tinta);transform-origin:0 50%}
.box{background:var(--papel);border:1px solid var(--gris-apoyo);padding:22px 28px}
.tile{left:0;top:0;width:66px;height:66px;background:var(--papel);border:1px solid var(--gris-apoyo);font-family:Archivo;font-weight:700;font-size:22px;line-height:64px;text-align:center;color:var(--tinta);transform-origin:50% 50%}
.tile.t30{background:var(--tinta);color:var(--papel);border-color:var(--tinta)}
.dashH{height:0;border-top:8px dashed var(--tinta)}

/* Titular grande (pregunta del gancho y del cierre): Instrument Serif, la palabra clave en itálica */
#headline{position:absolute;left:80px;top:430px;z-index:24;display:none;font-family:'Instrument Serif';font-weight:400;font-size:136px;line-height:128px;color:var(--tinta);white-space:nowrap}
#headline .ln{display:block}
#headline .w{display:inline-block;transform-origin:0 80%}
#headline .serif{font-style:italic}
#headline .ch{display:inline-block}

/* Texto de voz: bloques completos de hasta dos líneas, alto contraste */
#voz{position:absolute;left:80px;top:1352px;background:var(--papel);display:none;z-index:25;font-family:Figtree;font-weight:700;font-size:64px;line-height:76px;color:var(--tinta)}
#voz .in{position:absolute;left:0;top:0;padding:16px 30px 20px;white-space:nowrap}
#voz .ln{display:block}
#voz .w{display:inline-block;position:relative;z-index:0;transform-origin:0 80%}
#voz .serif{font-family:'Instrument Serif';font-style:italic;font-weight:400;font-size:110px;line-height:100px;letter-spacing:-.01em}
#voz .ch{display:inline-block}
#voz .amb::before{content:"";position:absolute;left:-8px;bottom:8%;height:58%;width:calc(var(--w,0) * (100% + 16px));background:var(--ambar);z-index:-1}

/* Aclaraciones legibles: «Ejemplo hipotético» y equivalencia */
#chip{position:absolute;left:80px;top:362px;z-index:26;background:var(--papel);border:1px solid var(--gris-apoyo);padding:6px 16px;font-family:Archivo;font-weight:700;font-size:30px;line-height:38px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta);opacity:0}
#pie{position:absolute;left:80px;top:1600px;font-family:Archivo;font-weight:600;font-size:32px;line-height:40px;color:var(--tinta);opacity:0;z-index:25}

/* Cabecera (marca secundaria): Archivo 700 · 28 px · +0.16 em */
#header{position:absolute;left:80px;top:270px;font-family:Archivo;font-weight:700;font-size:28px;line-height:36px;letter-spacing:.16em;text-transform:uppercase;z-index:27}
#header .marca{color:var(--tinta)}
#header .serie{color:var(--gris-calido)}
#header.inv .marca,#header.inv .serie{color:var(--papel)}

/* Pantalla de impacto: petróleo, sin personajes */
#impacto{position:absolute;inset:0;background:var(--petroleo);display:none;z-index:18;color:var(--papel)}
#impacto .q{position:absolute;left:80px;top:520px;font-family:'Instrument Serif';font-style:italic;font-size:118px;line-height:112px;white-space:nowrap}
#impacto .no{position:absolute;left:66px;top:780px;font-family:'Instrument Serif';font-size:480px;line-height:440px}
#impacto .ch{display:inline-block}

/* Guía de zona segura (solo revisión) */
#safe{position:absolute;inset:0;pointer-events:none;z-index:40;display:none}
#safe.on{display:block}
#safe::before,#safe::after{content:"";position:absolute;left:0;right:0;height:250px;background:rgba(154,59,46,.18);border-color:rgba(154,59,46,.8);border-style:dashed;border-width:0}
#safe::before{top:0;border-bottom-width:3px}
#safe::after{bottom:0;border-top-width:3px}

/* ---------- Controles (fuera del cuadro) ---------- */
#controls{display:flex;align-items:center;gap:12px;width:min(720px,calc(100vw - 32px));font-size:14px;flex-wrap:wrap}
body.capture #controls,body.capture #info{display:none}
#controls button{background:#E3DDD0;color:#05070A;border:0;padding:8px 14px;font:600 14px Archivo,sans-serif;cursor:pointer}
#controls button.alt{background:transparent;color:#E3DDD0;border:1px solid #8C8577}
#controls button.alt.active{background:#8C8577;color:#05070A}
#scrub{flex:1;min-width:160px;accent-color:#E8C46A}
#tc{font-variant-numeric:tabular-nums;min-width:120px}
#info{font-size:13px;color:#C9C4B8;width:min(720px,calc(100vw - 32px));display:flex;justify-content:space-between;gap:12px}
#fontwarn{position:fixed;inset:auto 16px 16px 16px;background:#9A3B2E;color:#F3EFE6;padding:12px 16px;font:600 14px Archivo,sans-serif;display:none;z-index:99}
</style>
</head>
<body>
<div id="viewport"><div id="stage">
  <div id="wide" data-bg="arcilla">
    <div class="wall"></div><div class="floor"></div>
    <div id="bgnext" data-bg="agua"><div class="wall"></div><div class="floor"></div></div>
    <div id="panel"></div>
    <div id="canela" class="char"></div>
    <div id="wbills"></div>
    <div id="frasco" class="char"><svg xmlns="http://www.w3.org/2000/svg" viewBox="40 -110 70 115"><rect x="52" y="-64" width="42" height="64" rx="9" fill="#E3DDD0"/><rect x="56" y="-76" width="34" height="12" rx="2.5" fill="#05070A"/><rect x="59" y="-48" width="28" height="16" fill="#F3EFE6"/><circle cx="65" cy="-12" r="5.5" fill="#8C8577"/><circle cx="78" cy="-13" r="5.5" fill="#8C8577"/></svg></div>
    <div id="candado" class="char"><svg viewBox="0 0 46 59" aria-hidden="true"><path d="M11 26V16a12 12 0 0 1 24 0v10" fill="none" stroke="#5E5A52" stroke-width="6"/><rect x="2" y="24" width="42" height="33" fill="#05070A"/><circle cx="23" cy="37" r="4.5" fill="#E8C46A"/><rect x="21" y="39" width="4" height="9" fill="#E8C46A"/></svg></div>
    <div id="michi" class="char"></div>
  </div>
  <div id="ins"></div>
  <div id="impacto"><div class="q">¿Te devuelven 10 mil?</div><div class="no">No.</div></div>
  <div id="headline"></div>
  <div id="voz"></div>
  <div id="chip">Ejemplo hipotético</div>
  <div id="pie">1 CATPESO = 1 peso mexicano</div>
  <div id="header"><div class="marca">Cuentas claras con MICHI</div><div class="serie">Plan de retiro</div></div>

</div></div>
<div id="controls">
  <button id="play">▶ Reproducir</button>
  <input id="scrub" type="range" min="0" max="45" step="0.01" value="0" aria-label="Tiempo">
  <span id="tc">00.00 / 45.00 s</span>
  <button id="safeBtn" class="alt">Zona segura</button>
</div>
<div id="info"><span id="fase">1 · Gancho</span><span>Video mudo · tiempos provisionales (~136 ppm)</span></div>
<div id="fontwarn">No cargó una tipografía de la marca. Exportación detenida (regla: sin sustituciones silenciosas).</div>

<script>

/* MICHI — rig 2D paramétrico (v1.0)
   Geometría: extraída de los trazos vectoriales del PDF «Diseño gatito y dinero final» (p.11 dibujo maestro; p.16 orejas y colas; p.18 poses base v01).
   Unidades: 1 u = 1 pt del PDF p.11. Origen (0,0) = centro de la base de la campana (piso). X → derecha del espectador, Y → abajo (SVG).
   Ángulos: grados. Positivo = sentido horario en pantalla, salvo orejas (positivo = hacia afuera) y párpado (positivo = extremo exterior más bajo = tristeza).
   Porcentajes de párpado: fracción del diámetro del ojo cubierta (0 = abierto, 1 = cerrado). */
(function (root) {
  const C = { black: '#05070A', gold: '#E8C46A', paper: '#F3EFE6', white: '#FFFFFF', bg: '#0B0D11', wall: '#1A2029', surface: '#2B3442', cold: '#7FA7C4' };

  // ---- Geometría (PDF) ----
  const G = {
    earL: [[-36.47, -150.87], [-43.11, -198.95], [-1.66, -172.42]],
    earPivot: [-19.07, -161.65],            // punto medio de la base de la oreja; verificado contra p.16 («relajadas», error < 0.2 u)
    head: { x: -41.45, y: -175.74, w: 82.9, h: 76.27, r: 24.87 },
    eyeX: 18.24, eyeY: -135.95, eyeR: 11.605, eyeRSorpresa: 14.08,
    pupil: { rx: 2.985, ry: 7.46 },
    hl: { dx: -3.31, dy: -4.14, r: 2.32 },
    nose: 'M0 -114.4L6.22 -121.86L-6.22 -121.86Z', noseOp: 0.6,
    mouthL: 'M0 -114.4C-4.97 -109.42 -9.67 -108.87 -14.09 -112.74',
    mouthR: 'M0 -114.4C4.97 -109.42 9.67 -108.87 14.09 -112.74',
    mouthW: 2.98, lineOp: 0.502,
    whiskL: ['M-36.47 -125.17L-66.32 -131.8', 'M-36.47 -118.54L-64.66 -109.42'],
    whiskR: ['M36.47 -125.17L66.32 -131.8', 'M36.47 -118.54L64.66 -109.42'],
    whiskW: 2.49,
    body: 'M-38.13 0C-38.13 -56.37 -23.21 -89.53 0 -89.53C23.21 -89.53 38.13 -56.37 38.13 0Z',
    bodyTop: [0, -89.53], neck: [0, -94.5], tailRoot: [36.5, -14], tailW: 12.43,
    closedL: 'M-10.04 -0.45C-3.38 5.1 3.28 5.1 9.94 -0.45', closedW: 4.15, // p.18 DORMIDO, relativo al centro del ojo
    pawW: 13.27,
  };

  // Colas: p.16 (nueve trazos) reescaladas al dibujo maestro. front = se dibuja delante del cuerpo.
  const TAILS = {
    relajada:   { d: 'M38.13 -11.61C71.29 -9.95 79.58 -36.47 67.97 -56.37', src: 'p.11 / p.16' },
    envolvente: { d: 'M33.2 -5C41.4 13.3 -9.9 14.9 -33.2 -1.7', front: true, src: 'p.16' },
    caida:      { d: 'M38.1 -6.6C59.7 -1.7 76.3 1.6 89.5 3.3', src: 'p.16' },
    arriba:     { d: 'M34.8 -23.2C59.7 -31.5 64.7 -69.6 58 -97.8', src: 'p.16' },
    rigida:     { d: 'M34.8 -23.2L64.7 -94.5', src: 'p.16' },
    pregunta:   { d: 'M34.8 -23.2C63 -34.8 66.3 -73 54.7 -86.2C46.4 -96.2 58 -109.4 69.6 -101.1', src: 'p.16' },
    agitada:    { d: 'M34.8 -19.9C63 -14.9 48.1 -46.4 72.9 -56.4C86.2 -63 79.6 -79.6 89.5 -87.9', src: 'p.16' },
    erizada:    { d: 'M34.8 -23.2L50.9 -98.8', src: 'PROPUESTA: p.16 la engrosa ×1.6 (viola grosor constante). Aquí: trayectoria rígida casi vertical, mismo grosor. PENDIENTE' },
    escondida:  { d: null, src: 'p.16 (sin trazo visible)' },
  };

  // Patas: solo «señala» viene del PDF (p.18). El resto son propuestas del sistema (p.64: «solo en señala, celebra, sostiene, cubre»).
  const PAWS = {
    none: [],
    senala: [{ side: -1, d: 'M-33.18 -46.4C-56.4 -49.72 -66.36 -67.99 -61.35 -86.21', src: 'p.18' }],
    sostener: [{ side: -1, d: 'M-31 -42C-25 -31 -15 -28 -8 -33' }, { side: 1, d: 'M31 -42C25 -31 15 -28 8 -33' }],
    arriba: [{ side: -1, d: 'M-31 -52C-50 -60 -58 -80 -52 -98' }, { side: 1, d: 'M31 -52C50 -60 58 -80 52 -98' }],
    cubrir: [{ side: -1, d: 'M-30 -58C-40 -84 -34 -116 -20 -134' }, { side: 1, d: 'M30 -58C40 -84 34 -116 20 -134' }],
  };

  const POSES = {
    sentado: { eyeScale: 1, pupilH: 1, closed: 0, paws: 'none' },
    senala: { eyeScale: 1, pupilH: 1, closed: 0, paws: 'senala' },
    sorpresa: { eyeScale: G.eyeRSorpresa / G.eyeR, pupilH: 1.10, closed: 0, paws: 'none' }, // p.18: ojo 14.08 u, pupila 9.95 u
    dormido: { eyeScale: 1, pupilH: 1, closed: 1, paws: 'none' },
  };

  const NEUTRAL = {
    pose: 'sentado', eyeScale: 1, gazeX: 0, gazeY: 0, pupilW: 1, pupilH: 1,
    lidTopL: 0, lidTopR: 0, lidTiltL: 0, lidTiltR: 0, lidBotL: 0, lidBotR: 0, closed: 0,
    earL: 0, earR: 0, earLiftL: 0, earLiftR: 0, head: 0, headDy: 0,
    bodySx: 1, bodySy: 1, lean: 0, bodyDx: 0, tailWag: 0,
    tail: 'relajada', paws: 'none', tears: 'none',
  };
  // Límites de transformación (propuestos) que protegen la anatomía.
  const LIMITS = {
    gazeX: [-1, 1], gazeY: [-1, 1], pupilW: [0.28, 2], pupilH: [0.38, 1.6],
    lidTopL: [0, 1], lidTopR: [0, 1], lidTiltL: [-26, 26], lidTiltR: [-26, 26], lidBotL: [0, 0.6], lidBotR: [0, 0.6], closed: [0, 1],
    earL: [-8, 55], earR: [-8, 55], earLiftL: [0, 6], earLiftR: [0, 6], head: [-18, 18], headDy: [-4, 8],
    bodySx: [0.94, 1.08], bodySy: [0.86, 1.08], lean: [-7, 7], bodyDx: [-9, 9], eyeScale: [1, 1.2133], tailWag: [-8, 8],
  };
  const NUM = Object.keys(LIMITS);
  const DISCRETE = ['pose', 'tail', 'paws', 'tears'];

  function normalize(q) {
    const p = Object.assign({}, NEUTRAL, q || {});
    for (const k of NUM) { const [a, b] = LIMITS[k]; p[k] = Math.min(b, Math.max(a, +p[k] || 0)); }
    if (!TAILS[p.tail]) p.tail = 'relajada';
    if (!PAWS[p.paws]) p.paws = 'none';
    return p;
  }
  // Interpolación entre dos estados: numéricos lineales; discretos cambian en t=0.5 («cambio controlado», sin morphing).
  function lerp(a, b, t) {
    a = normalize(a); b = normalize(b); const o = {};
    for (const k of NUM) o[k] = a[k] + (b[k] - a[k]) * t;
    for (const k of DISCRETE) o[k] = t < 0.5 ? a[k] : b[k];
    return o;
  }

  const f = n => (Math.round(n * 100) / 100);
  let uid = 0;

  function drop(x, y, s) {
    return `M${f(x)} ${f(y - 3.2 * s)}C${f(x + 2.3 * s)} ${f(y - 0.3 * s)} ${f(x + 2.3 * s)} ${f(y + 2.4 * s)} ${f(x)} ${f(y + 2.4 * s)}C${f(x - 2.3 * s)} ${f(y + 2.4 * s)} ${f(x - 2.3 * s)} ${f(y - 0.3 * s)} ${f(x)} ${f(y - 3.2 * s)}Z`;
  }

  function eye(p, side, id, nm, hlColor) {
    const sg = side === 'L' ? -1 : 1, ex = sg * G.eyeX, ey = G.eyeY, r = G.eyeR * p.eyeScale;
    const rx = G.pupil.rx * p.pupilW * p.eyeScale, ry = G.pupil.ry * p.pupilH * p.eyeScale;
    const tx = Math.max(1.2, r - rx - 1.4), ty = Math.max(1, r - ry - 0.6);
    const px = ex + p.gazeX * tx, py = ey + p.gazeY * ty;
    const top = Math.max(p['lidTop' + side], p.closed), tilt = p['lidTilt' + side], bot = p['lidBot' + side];
    const yT = ey - r + top * 2 * r, yB = ey + r - bot * 2 * r, bulge = Math.min(bot, 0.5) * r * 0.55;
    const x0 = ex - r - 8, x1 = ex + r + 8, cid = `${id}-eye${side}`;
    const tears = p.tears, wet = tears === 'humedos' || tears === 'acumuladas' || tears === 'llanto';
    let s = `<g${nm('MICHI_EYE_' + side)}><clipPath id="${cid}"><circle cx="${f(ex)}" cy="${f(ey)}" r="${f(r)}"/></clipPath>`;
    const eyeClosed = p.closed >= 0.97 || top >= 0.97;
    if (!eyeClosed) {
      s += `<g clip-path="url(#${cid})">`;
      s += `<circle${nm('MICHI_IRIS_' + side)} cx="${f(ex)}" cy="${f(ey)}" r="${f(r)}" fill="${C.gold}"/>`;
      s += `<ellipse${nm('MICHI_PUPIL_' + side)} cx="${f(px)}" cy="${f(py)}" rx="${f(rx)}" ry="${f(ry)}" fill="${C.black}"/>`;
      const hr = G.hl.r * p.eyeScale * (wet ? 1.45 : 1);
      s += `<circle${nm('MICHI_HIGHLIGHT_' + side)} cx="${f(ex + G.hl.dx * p.eyeScale)}" cy="${f(ey + G.hl.dy * p.eyeScale)}" r="${f(hr)}" fill="${hlColor}"/>`;
      s += `<path${nm('MICHI_LID_BOTTOM_' + side)} d="M${f(x0)} ${f(yB + bulge)}Q${f(ex)} ${f(yB - bulge)} ${f(x1)} ${f(yB + bulge)}L${f(x1)} ${f(ey + r + 20)}L${f(x0)} ${f(ey + r + 20)}Z" fill="${C.black}"/>`;
      if (wet) s += `<path d="M${f(x0)} ${f(yB + bulge - 1.1)}Q${f(ex)} ${f(yB - bulge - 1.1)} ${f(x1)} ${f(yB + bulge - 1.1)}" fill="none" stroke="${C.paper}" stroke-width="1.3" stroke-opacity="0.9"/>`;
      if (tears === 'acumuladas' || tears === 'llanto') s += `<path d="M${f(x0)} ${f(yB + bulge)}Q${f(ex)} ${f(yB - bulge)} ${f(x1)} ${f(yB + bulge)}L${f(x1)} ${f(yB + bulge - 3.6)}Q${f(ex)} ${f(yB - bulge - 3.6)} ${f(x0)} ${f(yB + bulge - 3.6)}Z" fill="${C.paper}" fill-opacity="0.92"/>`;
      s += `<rect${nm('MICHI_LID_TOP_' + side)} x="${f(x0)}" y="${f(ey - r - 40)}" width="${f(x1 - x0)}" height="${f(yT - (ey - r - 40))}" fill="${C.black}" transform="rotate(${f(sg * tilt)} ${f(ex)} ${f(yT)})"/>`;
      s += `</g>`;
    } else {
      s += `<path d="${G.closedL}" transform="translate(${f(ex)} ${f(ey)})${sg > 0 ? ' scale(-1 1)' : ''}" fill="none" stroke="${C.gold}" stroke-opacity="${G.lineOp}" stroke-width="${G.closedW}" stroke-linecap="round"/>`;
    }
    return s + `</g>`;
  }

  function tearsLayer(p, side, nm) {
    const sg = side === 'L' ? -1 : 1, ex = sg * G.eyeX, r = G.eyeR * p.eyeScale, yb = G.eyeY + r;
    const t = p.tears, P = C.paper; let s = '';
    const D = (x, y, k) => `<path d="${drop(x, y, k)}" fill="${P}"/>`;
    if (t === 'una' && side === 'L') s += D(ex + sg * r * 0.4, yb + 5, 0.9);
    if (t === 'dos') s += D(ex + sg * r * 0.4, yb + 5, 0.9);
    if (t === 'pocas') { if (side === 'L') { s += D(ex + sg * r * 0.42, yb + 2.5, 0.7) + D(ex + sg * r * 0.5, yb + 13, 0.95); } else s += D(ex + sg * r * 0.4, yb + 5, 0.85); }
    if (t === 'llanto') s += `<path d="M${f(ex + sg * r * 0.35)} ${f(yb - 2)}C${f(ex + sg * r * 0.4)} ${f(yb + 8)} ${f(ex + sg * r * 0.3)} ${f(yb + 16)} ${f(ex + sg * r * 0.36)} ${f(yb + 22)}" fill="none" stroke="${P}" stroke-width="2.6" stroke-linecap="round"/>` + D(ex + sg * r * 0.36, yb + 27, 1.05);
    return `<g${nm('MICHI_TEARS_' + side)}>${s}</g>`;
  }

  /* render(params, opts) → string SVG.
     opts: id (prefijo único de máscaras), layerIds (ids reales de capa, solo para una instancia), silhouette (contorno puro),
           highlight (#FFFFFF canónico p.11 | #F3EFE6), viewBox, width, height, jitter [dx,dy], bare (sin <svg>), title */
  function render(q, o) {
    o = o || {}; const p = normalize(q); const id = o.id || ('mi' + (++uid));
    const nm = n => o.layerIds ? ` id="${n}"` : ` data-layer="${n}"`;
    const B = C.black, hlc = o.highlight || C.white, sil = !!o.silhouette;
    const a = p.lean * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
    const M = (x, y) => [p.bodyDx + ca * x * p.bodySx - sa * y * p.bodySy, sa * x * p.bodySx + ca * y * p.bodySy];
    const sh = pt => { const m = M(pt[0], pt[1]); return [m[0] - pt[0], m[1] - pt[1]]; };
    const hs = sh(G.bodyTop), ts = sh(G.tailRoot);
    const tail = TAILS[p.tail];
    const tailEl = tail.d ? `<g${nm('MICHI_TAIL')} transform="translate(${f(ts[0])} ${f(ts[1])}) rotate(${f(p.lean + p.tailWag)} ${G.tailRoot[0]} ${G.tailRoot[1]})"><path d="${tail.d}" fill="none" stroke="${B}" stroke-width="${G.tailW}" stroke-linecap="round" stroke-linejoin="round"/></g>` : `<g${nm('MICHI_TAIL')}></g>`;
    const pawEls = PAWS[p.paws].map(pw => { const anc = [pw.side * 32, -48], t = sh(anc); return `<g transform="translate(${f(t[0])} ${f(t[1])}) rotate(${f(p.lean)} ${anc[0]} ${anc[1]})"><path d="${pw.d}" fill="none" stroke="${B}" stroke-width="${G.pawW}" stroke-linecap="round" stroke-linejoin="round"/></g>`; }).join('');
    const earT = s => { const sg = s === 'L' ? -1 : 1; return `translate(0 ${f(-p['earLift' + s])}) rotate(${f(sg * p['ear' + s])} ${f(sg * -G.earPivot[0])} ${G.earPivot[1]})`; };
    const earPath = s => { const sg = s === 'L' ? 1 : -1; return 'M' + G.earL.map(([x, y]) => `${f(x * sg)} ${y}`).join('L') + 'Z'; };
    const H = G.head;
    let face = '';
    if (!sil) {
      const wl = (arr) => arr.map(d => `<path d="${d}" fill="none" stroke="${C.gold}" stroke-opacity="${G.lineOp}" stroke-width="${G.whiskW}" stroke-linecap="round"/>`).join('');
      face += `<g${nm('MICHI_WHISKERS_L')}>${wl(G.whiskL)}</g><g${nm('MICHI_WHISKERS_R')}>${wl(G.whiskR)}</g>`;
      face += eye(p, 'L', id, nm, hlc) + eye(p, 'R', id, nm, hlc);
      face += `<path${nm('MICHI_NOSE')} d="${G.nose}" fill="${C.gold}" fill-opacity="${G.noseOp}"/>`;
      face += `<g${nm('MICHI_MOUTH')}><path d="${G.mouthL}" fill="none" stroke="${C.gold}" stroke-opacity="${G.lineOp}" stroke-width="${G.mouthW}" stroke-linecap="round"/><path d="${G.mouthR}" fill="none" stroke="${C.gold}" stroke-opacity="${G.lineOp}" stroke-width="${G.mouthW}" stroke-linecap="round"/></g>`;
      face += tearsLayer(p, 'L', nm) + tearsLayer(p, 'R', nm);
    }
    const head = `<g${nm('MICHI_HEAD')} transform="translate(${f(hs[0])} ${f(hs[1])}) rotate(${f(p.lean + p.head)} ${G.neck[0]} ${G.neck[1]}) translate(0 ${f(p.headDy)})">`
      + `<g${nm('MICHI_EAR_L')} transform="${earT('L')}"><path d="${earPath('L')}" fill="${B}"/></g>`

  // ---- Objetos del universo (fuera de la geometría del personaje). Coordenadas de escena. ----

    stack(x, y, w, n) { let s = '<g>'; const h = w * 0.16; for (let i = 0; i < n; i++) s += OBJ.coinSide(x + ((i * 37) % 5 - 2) * w * 0.012, y - i * h * 0.92, w); return s + '</g>'; },

/* =================== Curvas y utilidades =================== */
const clamp = x => Math.max(0, Math.min(1, x));
const outCubic = x => 1 - Math.pow(1 - x, 3);
const inOutCubic = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const inOut = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const outBack = (x, c1 = 1.70158) => { const c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const outBounce = x => { const n = 7.5625, d = 2.75;
  if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75;
  if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
const hop = (t, t0, dur, h) => (t >= t0 && t < t0 + dur) ? -h * Math.sin(Math.PI * (t - t0) / dur) : 0;
const wobble = (t, t0, amp = 5) => (t >= t0 && t < t0 + .8) ? amp * Math.sin((t - t0) * 26) * Math.exp(-(t - t0) * 6) : 0;
const pop = (x, d = .3, o = 2.2) => x < 0 ? 0 : outBack(clamp(x / d), o);
const at = (track, t) => { let v = track[0][1]; for (const [s, x] of track) { if (s <= t + 1e-6) v = x; else break; } return v; };
const idx = (track, t) => { let i = 0; for (let k = 0; k < track.length; k++) { if (track[k][0] <= t + 1e-6) i = k; else break; } return i; };
const inside = (t, ranges) => ranges.some(([a, b]) => t >= a && t < b);
const fmt = n => n.toLocaleString('en-US');

/* =================== MICHI (rig original) =================== */
const NEU = ST.neutro.levels[0];
function mirror(p) {
  return Object.assign({}, p, { gazeX: -p.gazeX, head: -p.head, lean: -p.lean, bodyDx: -p.bodyDx,
    earL: p.earR, earR: p.earL, earLiftL: p.earLiftR, earLiftR: p.earLiftL,
    lidTopL: p.lidTopR, lidTopR: p.lidTopL, lidTiltL: p.lidTiltR, lidTiltR: p.lidTiltL, lidBotL: p.lidBotR, lidBotR: p.lidBotL });
}
const MEV = MICHI.map(([t, key, lv, mir]) => {
  let p, s;
  if (key === 'atencion') { s = ST.neutro; p = Object.assign({}, NEU, { gazeX: -0.45, gazeY: 0.3, earL: -2, earR: -2, earLiftL: 1.5, earLiftR: 1.5 }); }
  else { s = ST[key]; p = s.levels[(lv || 1) - 1]; if (mir) p = mirror(p); }
  return { t, p: R.normalize(p), ms: (s.timing && s.timing.in) || 600, micro: s.micro || {} };
});
const MEV_T = MEV.map(e => [e.t]);
function poseAt(t) {
  const i = idx(MEV_T, t), e = MEV[i];
  if (i === 0) return { p: e.p, micro: e.micro };
  const u = (t - e.t) * 1000 / e.ms;
  if (u >= 1) return { p: e.p, micro: e.micro };
  return { p: R.lerp(poseAt(e.t - 1e-4).p, e.p, inOut(clamp(u))), micro: e.micro };
}
// Reposo sutil (respiración, cola, cabeza, mirada). Sin parpadeos: los ojos solo se cierran si la expresión lo pide.
function michiAt(t, id = 'michi') {
  const { p: base, micro } = poseAt(t), p = Object.assign({}, base), ms = t * 1000;
  if (!micro.freeze) {
    const br = micro.breath === 'lenta' ? [.007, 5200] : [.005, 3600];
    p.bodySy *= 1 + br[0] * Math.sin(2 * Math.PI * ms / br[1]);
    p.tailWag = (p.tailWag || 0) + Math.sin(ms / 370) * .45 + 3 * Math.sin(2 * Math.PI * ms / 1500);
    p.headDy = (p.headDy || 0) + Math.sin(ms / 1250) * .14;
    p.gazeX = Math.max(-1, Math.min(1, (p.gazeX || 0) + Math.sin(ms / 1700) * .012));
  }
  return R.render(p, { id, highlight: '#FFFFFF' });
}
function michiCU(t, id, k, cx, cy) {
  return `<div class="cu" style="left:${cx - 116 * k}px;top:${cy - 228 * k}px;width:${232 * k}px;height:${266 * k}px">${michiAt(t, id)}</div>`;
}

function letters(el, x, rise, stagger) {
  el.querySelectorAll('.ch').forEach((c, j) => { const y = x - j * stagger, s = c.style;
    if (y < 0) { s.opacity = 0; return; }
    s.opacity = clamp(y / .1); s.filter = y < .22 ? `blur(${(1 - y / .22) * 12}px)` : ''; s.transform = `translateY(${(1 - outCubic(clamp(y / .26))) * rise}px)`; });
}
const split = el => { if (!el.dataset.split) { el.innerHTML = [...el.textContent].map(c => `<span class="ch">${c === ' ' ? '&nbsp;' : c}</span>`).join(''); el.dataset.split = 1; } };
function animEl(el, dt) {
  const a = el.dataset.a, x = dt - +(el.dataset.d || 0), st = el.style;
  if (a === 'count') { const d = +(el.dataset.dur || .8); el.textContent = fmt(Math.round(+el.dataset.n * outCubic(clamp(x / d)) / 100) * 100); st.opacity = x < 0 ? 0 : 1; return; }
  if (x < 0) { st.opacity = 0; return; }
  st.opacity = clamp(x / (a === 'fade' ? .2 : .08));
  st.filter = x < .2 ? `blur(${(1 - x / .2) * 10}px)` : '';
  if (a === 'pop') st.transform = `scale(${1.22 - .22 * outBack(clamp(x / .32), 2.2)})`;
  else if (a === 'rise') st.transform = `translateY(${(1 - outCubic(clamp(x / .28))) * 50}px)`;
  else if (a === 'slide') st.transform = `translateX(${(1 - outCubic(clamp(x / .3))) * -40}px)`;
}

    show($('bgnext'), true); $('bgnext').style.clipPath = `circle(${inOutCubic(clamp(u)) * 2400}px at ${cur[2]}px ${cur[3]}px)`;
  } else { set('bgBase', cur[1], v => $('wide').dataset.bg = v); show($('bgnext'), false); }
  // Acercamiento del gancho
  const z = t < 3.8 ? 1 + (ZOOM.s - 1) * outCubic(clamp((t - ZOOM.t0) / ZOOM.dur)) : 1;
  $('wide').style.transform = `scale(${z})`;

  $('michi').style.transform = `translateY(${MICHI_HOPS.reduce((a, [t0, d, h]) => a + hop(t, t0, d, h), 0)}px)`;

  const ch = CANELA_HOPS.reduce((a, [t0, d, h]) => a + hop(t, t0, d, h), 0);
  $('canela').style.transform = `translateY(${ch}px) scaleY(${1 + .008 * Math.sin(2 * Math.PI * t / 3.1)})`;
  // Billetes de la aportación hacia la boca del frasco
  $('wbills').querySelectorAll('img').forEach((b, k) => {
    const s = WBILLS.t0 + k * WBILLS.step, uu = (t - s) / WBILLS.dur;
    if (uu < 0 || uu >= 1) { b.style.display = 'none'; return; }
    const e = inOut(uu), x = -120 + (428 + 120) * e, y = 520 - 160 * Math.sin(Math.PI * uu) + 640 * uu * uu;
    b.style.display = 'block'; b.style.transform = `translate(${x}px, ${y}px) rotate(${(k % 2 ? 1 : -1) * 220 * uu}deg)`;
  });
  $('frasco').style.transform = `rotate(${JAR_WOBBLE.reduce((a, t0) => a + wobble(t, t0), 0)}deg)`;
  show($('candado'), t >= LOCK_WIDE);

  set('panelKey', shown || '', v => { el.innerHTML = v ? PANELS[v] : ''; });
  show(el, !!shown);

  }
}

    fade(q, t - a - .15, .25); q.style.transform = `translateY(${(1 - outCubic(clamp((t - a - .15) / .3))) * 30}px)`;
    letters(no, t - (a + 1.75), 90, .07);
  }
  $('header').classList.toggle('inv', r > 712);
  return r;
}

/* ---------- Titular grande ---------- */
function parse(text, t0, step) {
  const lines = [[]], words = []; let i = 0;
  for (let tok of text.split(' ')) {
    if (tok === '/') { lines.push([]); continue; }
    const w = { t: t0 + step * i++, serif: false, amb: false };
    while (tok[0] === '~' || tok[0] === '*') { if (tok[0] === '~') w.serif = true; else w.amb = true; tok = tok.slice(1); }
    w.text = tok; lines[lines.length - 1].push(w); words.push(w);
  }
  return { lines, words };
}
function wordsHTML(lines, words) {
  return lines.map(l => '<span class="ln">' + l.map(w => {
    const k = words.indexOf(w), cls = 'w' + (w.serif ? ' serif' : '') + (w.amb ? ' amb' : '');
    const inner = w.serif ? [...w.text].map(c => `<span class="ch">${c}</span>`).join('') : w.text;
    return `<span class="${cls}" data-k="${k}">${inner}</span>`; }).join(' ') + '</span>').join('');
}
HEADS.forEach(h => { Object.assign(h, parse(h.text, h.t, h.step)); h.html = wordsHTML(h.lines, h.words); });
function renderHead(t) {
  const el = $('headline'), h = HEADS.find(h => t >= h.t - .04 && t < h.end);
  set('head', h ? HEADS.indexOf(h) : -1, () => { el.innerHTML = h ? h.html : ''; });
  show(el, !!h);
  if (!h) return;
  const q = clamp((t - (h.end - EXIT)) / EXIT); el.style.opacity = 1 - q; el.style.filter = q > 0 ? `blur(${q * 14}px)` : '';
  el.querySelectorAll('.w').forEach((w, k) => { const wd = h.words[k], x = t - wd.t, s = w.style;
    if (wd.serif) { letters(w, x, 60, .035); return; }
    s.opacity = x < 0 ? 0 : clamp(x / .12); s.filter = x >= 0 && x < .18 ? `blur(${(1 - x / .18) * 12}px)` : '';
    s.transform = `translateY(${(1 - outCubic(clamp(x / .24))) * 24}px)`; });
}

/* ---------- Texto de voz ---------- */
FRASES.forEach(f => {
  f.lines = [[]]; f.words = [];
  for (const [t0, txt] of f.segs) { const p = parse(txt, t0, WORD * REVEAL);
    p.lines.forEach((l, li) => { if (li > 0) f.lines.push([]); f.lines[f.lines.length - 1].push(...l); }); f.words.push(...p.words); }
  f.start = f.words[0].t;
  f.html = '<div class="in">' + wordsHTML(f.lines, f.words) + '</div>';
});
let fontsReady = false;
function measure(el) {
  const ws = [...el.querySelectorAll('.w')], lns = [...el.querySelectorAll('.ln')], inn = el.querySelector('.in'), sizes = [];
  for (let n = 1; n <= ws.length; n++) {
    ws.forEach((w, k) => w.style.display = k < n ? 'inline-block' : 'none');
    lns.forEach(l => l.style.display = [...l.querySelectorAll('.w')].some(w => w.style.display !== 'none') ? 'block' : 'none');
    sizes.push([inn.offsetWidth, inn.offsetHeight]);
  }
  return sizes;
}
function renderVoz(t) {
  const el = $('voz'), st = el.style, f = FRASES.find(f => t >= f.start - .04 && t < f.end);
  set('frase', f ? FRASES.indexOf(f) + (fontsReady ? 'm' : '') : '', () => { el.innerHTML = f ? f.html : ''; if (f) { show(el, true); f.sizes = measure(el); } });
  show(el, !!f);
  if (!f) return;
  const ws = [...el.querySelectorAll('.w')];
  let n = 0; f.words.forEach(w => { if (t >= w.t - .04) n++; });
  ws.forEach((w, k) => w.style.display = k < n ? 'inline-block' : 'none');
  el.querySelectorAll('.ln').forEach(l => l.style.display = [...l.querySelectorAll('.w')].some(w => w.style.display !== 'none') ? 'block' : 'none');
  const cur = f.sizes[n - 1], prev = n > 1 ? f.sizes[n - 2] : [cur[0] * .55, cur[1]];
  const u = outCubic(clamp((t - (f.words[n - 1].t - .04)) / .16));
  st.width = (prev[0] + (cur[0] - prev[0]) * u) + 'px'; st.height = (prev[1] + (cur[1] - prev[1]) * u) + 'px';
  const q = clamp((t - (f.end - EXIT)) / EXIT);
  st.opacity = (1 - q) * clamp((t - (f.start - .04)) / .1); st.filter = q > 0 ? `blur(${q * 14}px)` : '';
  ws.slice(0, n).forEach((w, k) => {
    const wd = f.words[k], x = t - (wd.t - .04), s = w.style;
    if (wd.serif) letters(w, x, 48, .035);
    else { s.opacity = clamp(x / .12); s.filter = x < .16 ? `blur(${(1 - x / .16) * 10}px)` : ''; s.transform = `translateY(${(1 - outCubic(clamp(x / .2))) * 14}px)`; }
    if (wd.amb) s.setProperty('--w', outCubic(clamp((x - .12) / .3)));
  });
}

function renderAt(t) {
  t = Math.max(0, Math.min(DUR, t));
  const r = renderImpact(t);
  const insOn = renderIns(t);
  const wideOn = !insOn && r < 2300;
  set('wideOn', wideOn, v => show($('wide'), v));
  if (wideOn) renderWide(t);
  renderHead(t);
  renderVoz(t);
  const chipOn = inside(t, CHIP), pieOn = inside(t, PIE);
  const fadeIn = (ranges) => { const g = ranges.find(([a, b]) => t >= a && t < b); return g ? clamp((t - g[0]) / .25) : 0; };
  $('chip').style.opacity = chipOn ? fadeIn(CHIP) : 0;
  $('pie').style.opacity = pieOn ? fadeIn(PIE) : 0;
  set('fase', at(FASES, t), v => $('fase').textContent = v);
  $('tc').textContent = t.toFixed(2).padStart(5, '0') + ' / 45.00 s';
  $('scrub').value = t;
}
window.renderAt = renderAt;
window.ANIMATIC_DUR = DUR;

/* =================== Escala y reproducción =================== */
const capture = new URLSearchParams(location.search).has('capture');
if (capture) document.body.classList.add('capture');
function fit() { const w = $('viewport').clientWidth; stage.style.transform = `scale(${w / 1080})`; }
addEventListener('resize', fit); fit();
let playing = false, t0 = 0, tStart = 0, cur = 0;
function loop(now) { if (!playing) return; cur = tStart + (now - t0) / 1000; if (cur >= DUR) { cur = DUR; playing = false; $('play').textContent = '▶ Reproducir'; } renderAt(cur); if (playing) requestAnimationFrame(loop); }
$('play').onclick = () => { if (playing) { playing = false; $('play').textContent = '▶ Reproducir'; return; }
  if (cur >= DUR) cur = 0; playing = true; tStart = cur; t0 = performance.now(); $('play').textContent = '❚❚ Pausa'; requestAnimationFrame(loop); };
$('scrub').oninput = e => { playing = false; $('play').textContent = '▶ Reproducir'; cur = +e.target.value; renderAt(cur); };
$('safeBtn').onclick = () => { const on = $('safe').classList.toggle('on'); $('safeBtn').classList.toggle('active', on); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); $('play').click(); }
  if (e.code === 'ArrowRight') { cur = Math.min(DUR, cur + (e.shiftKey ? 1 : 1 / 30)); renderAt(cur); }
  if (e.code === 'ArrowLeft') { cur = Math.max(0, cur - (e.shiftKey ? 1 : 1 / 30)); renderAt(cur); } });

/* =================== Tipografías: sin sustituciones silenciosas =================== */
const FONTS = ['700 28px Archivo', '600 40px Archivo', '400 100px "Instrument Serif"', 'italic 400 100px "Instrument Serif"', '700 64px Figtree'];
window.fontsOK = document.fonts.ready.then(() => Promise.all(FONTS.map(f => document.fonts.load(f, 'Aa0,÷×¿ó')))).then(() => {
  const ok = FONTS.every(f => document.fonts.check(f, 'Aa0'));
  if (!ok) $('fontwarn').style.display = 'block';
  fontsReady = ok; last.frase = undefined; renderAt(cur);
  return ok;
});
renderAt(0);
})();
</script>
